    <!-- i18n 国际化（内联避免 ERR_CONNECTION_RESET 导致 i18n 未定义） -->
    <script>
    (function(){
    window.TS_ASSET_VERSION = '0.6.1-lpmu6-keygen1';
    var i18n = (function() {
        var currentLang = 'zh-CN';
        var languages = {};
        var supportedLanguages = { 'zh-CN': { name: '中文', flag: '' }, 'en-US': { name: 'English', flag: '' } };
        function registerLanguage(code, translations) { languages[code] = translations; }
        function setLanguage(lang, initial) {
            if (languages[lang]) {
                currentLang = lang;
                if (!initial) { try { localStorage.setItem('ts_language', lang); } catch(e) {} }
                document.documentElement.lang = lang;
                /* 同步到设备端 system.language（供终端 help 等 i18n 使用） */
                if (!initial && window.api && typeof window.api.configSet === 'function') {
                    var deviceLang = lang === 'zh-CN' ? 1 : 0;
                    window.api.configSet('system.language', deviceLang, true).catch(function(){});
                }
                window.dispatchEvent(new CustomEvent('languageChanged', { detail: { language: lang, initial: !!initial } }));
                return true;
            }
            return false;
        }
        function getLanguage() { return currentLang; }
        function lookup(key) {
            return key.split('.').reduce(function(obj, k) { return obj && obj[k]; }, languages[currentLang] || {});
        }
        function unavailable() {
            return currentLang === 'zh-CN' ? '说明暂时无法显示，请重新加载界面后再试。' : 'This information is unavailable. Reload the interface and try again.';
        }
        function complete(key, params) {
            var value = lookup(key);
            if (typeof value !== 'string') return false;
            return !Array.from(value.matchAll(/(?<!\$)\{(\w+)\}/g)).some(function(m) { return !params || params[m[1]] === undefined || params[m[1]] === null; });
        }
        function translate(key, params) {
            params = params || {};
            if (!complete(key, params)) {
                console.warn('Incomplete translation', currentLang, key, params);
                return unavailable();
            }
            return lookup(key).replace(/(?<!\$)\{(\w+)\}/g, function(m, p) { return String(params[p]); });
        }
        function init() {
            try {
                var saved = localStorage.getItem('ts_language');
                /* 使用 supportedLanguages 校验（languages 在 init 时尚未加载语言包） */
                if (saved && supportedLanguages[saved]) {
                    currentLang = saved;
                } else {
                    currentLang = (navigator.language || '').indexOf('zh') === 0 ? 'zh-CN' : 'en-US';
                }
            } catch(e) {}
            document.documentElement.lang = currentLang;
        }
        function translateDOM(root) {
            root = root || document;
            root.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                var params = el.dataset.i18nParams ? JSON.parse(el.dataset.i18nParams) : {};
                el.textContent = translate(key, params);
            });
            root.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) { el.placeholder = translate(el.getAttribute('data-i18n-placeholder')); });
            root.querySelectorAll('[data-i18n-title]').forEach(function(el) { el.title = translate(el.getAttribute('data-i18n-title')); });
        }
        return { complete: complete, unavailable: unavailable, hasLanguage: function(lang) { return !!languages[lang]; }, registerLanguage: registerLanguage, setLanguage: setLanguage, getLanguage: getLanguage, translate: translate, init: init, getSupportedLanguages: function() { return supportedLanguages; }, translateDOM: translateDOM };
    })();
    window.i18n = i18n;
    window.t = i18n.translate;
    window.setLanguage = i18n.setLanguage;
    window.getLanguage = i18n.getLanguage;
    window.translateDOM = i18n.translateDOM;
    window.toggleLanguageMenu = function() {
        var menu = document.getElementById('lang-menu');
        if (!menu) return;
        if (menu.classList.contains('hidden')) {
            var langs = i18n.getSupportedLanguages(), cur = i18n.getLanguage();
            menu.innerHTML = Object.keys(langs).map(function(code) {
                var info = langs[code];
                return '<div class="lang-menu-item' + (code === cur ? ' active' : '') + '" onclick="selectLanguage(\'' + code + '\')">' + (code === cur ? '<svg class="i"><use href="#ri-check-line"/></svg>' : '') + info.name + '</div>';
            }).join('');
            menu.classList.remove('hidden');
            setTimeout(function() { document.addEventListener('click', window.closeLangMenuOnClickOutside); }, 10);
        } else menu.classList.add('hidden');
    };
    window.closeLangMenuOnClickOutside = function(e) {
        var sw = document.getElementById('lang-switch');
        if (sw && !sw.contains(e.target)) {
            var m = document.getElementById('lang-menu');
            if (m) m.classList.add('hidden');
            document.removeEventListener('click', window.closeLangMenuOnClickOutside);
        }
    };
    var languageLoads = {};
    var languageGeneration = 0;
    var initialReady = false;
    function languageNotice(lang, failed, retry) {
        var box = document.getElementById('language-status');
        if (!box) {
            box = document.createElement('div');
            box.id = 'language-status';
            box.setAttribute('role', 'alert');
            box.className = 'm-float lang-notice';
            document.body.appendChild(box);
        }
        box.replaceChildren();
        var text = document.createElement('span');
        text.textContent = lang === 'zh-CN'
            ? (failed ? '界面语言加载失败。请检查网络后重试。' : '正在加载界面语言…')
            : (failed ? 'The interface language could not be loaded. Check your connection and retry.' : 'Loading the interface language…');
        box.appendChild(text);
        if (failed) {
            var button = document.createElement('button');
            button.className = 'btn sm';
            button.textContent = lang === 'zh-CN' ? '重试' : 'Retry';
            button.onclick = retry;
            box.appendChild(button);
        }
        box.hidden = false;
    }
    function loadLanguage(lang) {
        if (i18n.hasLanguage(lang)) return Promise.resolve();
        if (languageLoads[lang]) return languageLoads[lang];
        languageLoads[lang] = new Promise(function(resolve, reject) {
            var script = document.createElement('script');
            var timer = setTimeout(function() { finish(false); }, 15000);
            function finish(ok) {
                clearTimeout(timer);
                script.onload = script.onerror = null;
                if (ok && i18n.hasLanguage(lang)) resolve();
                else { script.remove(); reject(new Error('Language resource unavailable: ' + lang)); }
            }
            script.src = '/js/lang/' + lang + '.js?v=' + window.TS_ASSET_VERSION;
            script.onload = function() { finish(true); };
            script.onerror = function() { finish(false); };
            document.head.appendChild(script);
        }).finally(function() { delete languageLoads[lang]; });
        return languageLoads[lang];
    }
    window.selectLanguage = async function(lang) {
        if (!i18n.getSupportedLanguages()[lang]) return false;
        var generation = ++languageGeneration;
        languageNotice(lang, false);
        try {
            await loadLanguage(lang);
            if (generation !== languageGeneration) return false;
            var first = !initialReady;
            initialReady = true;
            document.getElementById('app').inert = false;
            i18n.setLanguage(lang, first);
            document.getElementById('lang-name').textContent = lang === 'zh-CN' ? '中文' : 'EN';
            i18n.translateDOM();
            document.getElementById('language-status').hidden = true;
            document.getElementById('lang-menu').classList.add('hidden');
            if (typeof updateAuthUI === 'function') updateAuthUI();
            if (first) window.dispatchEvent(new CustomEvent('languageReady'));
            else if (typeof window.reloadCurrentPage === 'function') window.reloadCurrentPage();
            return true;
        } catch (error) {
            if (generation === languageGeneration) languageNotice(lang, true, function() { window.selectLanguage(lang); });
            console.error(error);
            return false;
        }
    };
    i18n.isReady = function() { return initialReady; };
    i18n.init();
    document.getElementById('app').inert = true;
    window.languageReady = window.selectLanguage(i18n.getLanguage());
    })();
    </script>
