<!doctype html><meta charset="utf-8"><link rel="stylesheet" ><link rel="stylesheet" href="spec.css"><style>body{margin:0}</style><div class="dc wall" style="width:1440px;height:790px;position:relative;overflow:hidden"><div class="dim" style="background:rgba(20,30,45,.14)"></div><div class="flow-wrap" style="position:relative;padding:40px"><div style="display:grid;grid-template-columns:660px 660px;gap:40px;align-items:start;justify-content:center"><div><div class="sheet m-float" style="position:relative;width:660px;padding:24px;margin-bottom:40px"><div class="st" style="font-size:20px;margin-bottom:14px">菜单 · 提示 · 状态</div><div class="t-note" style="margin-bottom:8px">语言菜单（模式 D）</div><div class="m-float" style="border-radius:16px;padding:6px;width:180px"><div style="height:32px;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:8px;">✓ 中文</div><div style="height:32px;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:8px;padding-left:28px;background:var(--accent-text);color:#fff">English <span style="margin-left:auto;font-size:12px;opacity:.8">悬停</span></div></div><div class="t-note" style="margin:18px 0 8px">Toast（成功 / 信息 / 警告 / 错误）</div><div class="m-float" style="border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;width:max-content;margin-bottom:10px"><span class="dot ok"></span><span class="t-body">已保存关机设置</span></div><div class="m-float" style="border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;width:max-content;margin-bottom:10px"><span class="dot "></span><span class="t-body">正在连接…</span></div><div class="m-float" style="border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;width:max-content;margin-bottom:10px"><span class="dot warn"></span><span class="t-body">输入电压过低：11.8 V</span></div><div class="m-float" style="border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;width:max-content;margin-bottom:10px"><span class="dot bad"></span><span class="t-body">保存失败：设备无响应</span></div><div class="t-note" style="margin:18px 0 8px">列表与控件状态</div><div class="card" style="background:rgba(255,255,255,.72);padding:0;overflow:hidden"><div class="tr" style="--cols:1fr 120px"><div>默认行</div><div>值</div></div><div class="tr hov" style="--cols:1fr 120px"><div>悬停行</div><div>值</div></div><div class="tr rsel" style="--cols:1fr 120px"><div>选中行</div><div>值</div></div></div>
