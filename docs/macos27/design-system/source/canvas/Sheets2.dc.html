<div class="dc wall" style="width:1440px;height:1136px;position:relative;overflow:hidden"><div class="dim" style="background:rgba(20,30,45,.14)"></div><div class="flow-wrap" style="position:relative;padding:40px"><div style="display:grid;grid-template-columns:660px 660px;gap:40px;align-items:start;justify-content:center"><div><div class="sheet m-float" style="position:relative;width:520px;max-width:100%;margin-bottom:40px"><div class="sh"><span class="st">上传文件</span></div><div style="border:1.5px dashed var(--hair-strong);border-radius:16px;height:110px;display:grid;place-items:center;color:var(--ink-2)"><div style="text-align:center"><svg class="i" viewBox="0 0 16 16"><path d="M8 10.5V2.5M5 5.5l3-3 3 3M3 10.5v2h10v-2"/></svg><div class="t-label" style="margin-top:6px">选择文件，或拖放到此处</div></div></div><div class="sf"><button class="btn lg" >取消</button><button class="btn lg primary" >上传</button></div></div><div class="sheet m-float" style="position:relative;width:460px;max-width:100%;margin-bottom:40px"><div class="sh"><span class="st">新建文件夹</span></div><div class="grp"><div class="row"><div class="rl">名称</div><div class="rc"><input class="field " value="" placeholder="输入文件夹名称" aria-label="输入文件夹名称" style="width:220px"></div></div></div><div class="sf"><button class="btn lg" >取消</button><button class="btn lg primary" >创建</button></div></div><div class="sheet m-float" style="position:relative;width:460px;max-width:100%;margin-bottom:40px"><div class="sh"><span class="st">重命名</span></div><div class="grp"><div class="row"><div class="rl">新名称</div><div class="rc"><input class="field " value="fixture.txt" placeholder="" aria-label="fixture.txt" style="width:220px"></div></div></div><div class="sf"><button class="btn lg" >取消</button><button class="btn lg primary" >确认</button></div></div></div><div><div class="sheet m-float" style="position:relative;width:420px;max-width:100%;margin-bottom:40px"><div class="sh"><span class="st">删除 fixture.txt？</span></div><div class="t-body" style="color:var(--ink-2)">此操作无法撤销。</div><div class="sf"><button class="btn lg" >取消</button><button class="btn lg primary" style="background:var(--bad);border-color:var(--bad)">删除</button></div></div><div class="sheet m-float" style="position:relative;width:560px;max-width:100%;margin-bottom:40px"><div class="sh"><span class="st">生成新密钥</span></div><div class="grp"><div class="row"><div class="rl">密钥 ID</div><div class="rc"><input class="field mono" value="" placeholder="如: default, mykey" aria-label="如: default, mykey" style="width:200px"></div></div><div class="row"><div class="rl">类型</div><div class="rc"><button class="field sel" style="width:200px;text-align:left">RSA 2048-bit (推荐)</button></div></div><div class="row"><div class="rl">备注</div><div class="rc"><input class="field " value="" placeholder="如: TianshanOS@device" aria-label="如: TianshanOS@device" style="width:200px"></div></div><div class="row"><div class="rl">别名</div><div class="rc"><input class="field " value="" placeholder="用于替代密钥 ID 显示" aria-label="用于替代密钥 ID 显示" style="width:200px"></div></div><div class="row"><div class="rl">可导出</div><div class="rc"><button class="switch on" role="switch" aria-checked="true" aria-label="可导出"></button></div></div><div class="row"><div class="rl">隐藏</div><div class="rc"><button class="switch" role="switch" aria-checked="false" aria-label="隐藏"></button></div></div></div><div class="sf"><button class="btn lg" >取消</button><button class="btn lg primary" >生成</button></div></div><div class="sheet m-float" style="position:relative;width:560px;max-width:100%;margin-bottom:40px"><div class="sh"><span class="st">部署公钥</span></div><div class="grp"><div class="row"><div class="rl">主机</div><div class="rc"><input class="field mono" value="" placeholder="192.168.55.100 或 hostname" aria-label="192.168.55.100 或 hostname" style="width:200px"></div></div><div class="row"><div class="rl">用户名</div><div class="rc"><input class="field " value="root" placeholder="" aria-label="root" style="width:200px"></div></div><div class="row"><div class="rl">端口</div><div class="rc"><input class="field " value="22" placeholder="" aria-label="22" style="width:80px"></div></div><div class="row"><div class="rl">SSH 登录密码</div><div class="rc"><input class="field " value="" placeholder="输入 SSH 登录密码" aria-label="输入 SSH 登录密码" style="width:200px"></div></div></div><div class="sf"><button class="btn lg" >取消</button><button class="btn lg primary" >开始部署</button></div></div></div></div></div></div>
